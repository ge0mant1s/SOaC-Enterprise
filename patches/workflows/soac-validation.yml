name: SOaC Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token: this workflow only checks out the repo and
# runs the harness validation; it needs read-only access to repo contents.
# (OSPS Baseline: restrict GITHUB_TOKEN permissions.)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
        working-directory: tools/soac-harness

      - name: Ensure no committed package archives in repository
        run: |
          set -euo pipefail
          if find downloads/packages -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tgz' -o -name '*.gz' \) | grep -q .; then
            echo "Committed package archives are not allowed under downloads/packages/."
            echo "Build and publish pkg-001..pkg-011 as release assets instead."
            find downloads/packages -type f
            exit 1
          fi


      - name: Ensure Security Insights mirrors are in sync
        run: |
          set -euo pipefail
          cmp -s security-insights.yml .github/security-insights.yml || {
            echo "security-insights.yml and .github/security-insights.yml must be byte-identical"
            exit 1
          }
          cmp -s security-insights.yml github/security-insights.yml || {
            echo "security-insights.yml and github/security-insights.yml must be byte-identical"
            exit 1
          }
          cmp -s security-insights.yml security-insights.yaml || {
            echo "security-insights.yml and security-insights.yaml must be byte-identical"
            exit 1
          }
          cmp -s security-insights.yml .github/security-insights.yaml || {
            echo "security-insights.yml and .github/security-insights.yaml must be byte-identical"
            exit 1
          }
          cmp -s security-insights.yml github/security-insights.yaml || {
            echo "security-insights.yml and github/security-insights.yaml must be byte-identical"
            exit 1
          }

      - name: Run SOaC validation
        run: npm run validate
        working-directory: tools/soac-harness

