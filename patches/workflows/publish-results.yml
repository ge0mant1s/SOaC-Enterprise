# OSPS Baseline results published to grc.store, for the Security Slam
# Mechanizer badge (Option 2) and the REQUIRED evidence for the Defender badge.
#
# Publishes to grc.store namespace "soac" (personal namespace owned by
# ge0mant1s, created 2026-10-27), with ge0mant1s/SOaC-Enterprise bound as its
# trusted publisher (OIDC, no secret). Target page:
#   https://grc.store/targets/soac/soac-enterprise
# Setup guide: https://securityslam.com/library/grc-store-setup
# Defender needs trusted runs on 2+ different days, the newest within 30 days.
#
# Pinning note: the only `uses:` is the publish workflow, which the hub REQUIRES
# by tag (@v1), not SHA — a SHA-pinned call fails the hub's identity check.
name: Publish OSPS Baseline results to grc.store

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the scan but publish nothing (bundles land in the pvtr-bundles artifact)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *" # Daily 06:17 UTC: keeps the grc.store record recurring (Defender: runs on 2+ days)
  push:
    branches: [main]
  # Never pull_request: the hub stores one log per target and catalog every ten
  # minutes and refuses the rest with rate_limited.

permissions: {}

# The hub accepts one log per target per catalog every 10 minutes and answers
# 429 rate_limited otherwise (seen 2026-11-20 when six Dependabot PRs were
# merged within six minutes). A burst of pushes collapses to the newest run.
concurrency:
  group: publish-results-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    # Dependabot merges come in batches and only bump dependencies; the daily
    # schedule publishes them. Checked on the commit author, because the push
    # actor is whoever clicked merge. Other pushes, dispatches and cron run.
    if: >-
      github.event_name != 'push' ||
      github.event.head_commit.author.name != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the latest release tag
      actions: read # Find the last successful publish run (hub rate-limit window)
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Two merges a few minutes apart (seen 2026-11-27, #175 then #176) are not
      # concurrent, so the concurrency group cannot collapse them and the second
      # publish got 429. Wait out the rest of the hub's 10-minute window since
      # the last successful run; a newer push still cancels this run while it waits.
      - name: Wait for the hub's rate-limit window
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_SECONDS: "660" # 10 min hub window + 1 min margin
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-results.yml \
            --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty' || true)
          if [ -z "$last" ]; then echo "No previous successful publish found"; exit 0; fi
          elapsed=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          remaining=$(( WINDOW_SECONDS - elapsed ))
          if [ "$remaining" -gt 0 ]; then
            echo "Last successful publish finished at $last (${elapsed}s ago); waiting ${remaining}s"
            sleep "$remaining"
          else
            echo "Last successful publish finished at $last (${elapsed}s ago); no wait needed"
          fi

      - name: Latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  results:
    needs: version
    permissions:
      contents: read # The scanner reads this repository through the job token
      id-token: write # Trusted publishing to the hub and the Sigstore signing identity
      security-events: write
    # By tag, not SHA, on purpose: the hub compares the signing certificate's
    # workflow ref to this exact tag and rejects a SHA-pinned call.
    uses: revanite-io/pvtr-publish-results/.github/workflows/publish.yml@v1 # zizmor: ignore[unpinned-uses] the hub requires the tag
    with:
      target: soac/soac-enterprise@${{ needs.version.outputs.version }}
      license: CC0-1.0 # SPDX expression the result is published under
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      # Inline because the plugin reads its token only from these config vars.
      # The job token is read-only and scoped to this repository; settings it
      # cannot read (org MFA, some admin settings) report "Needs Review".
      config: |
        targets:
          soac-enterprise:
            plugin: openssf/github-repo
            policy:
              catalogs:
                - osps-baseline
              applicability:
                - maturity-1 # The project's Baseline level
            vars:
              owner: ge0mant1s
              repo: SOaC-Enterprise
              token: ${{ secrets.GITHUB_TOKEN }}
