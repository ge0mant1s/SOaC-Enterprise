apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 028-asyncapi-miasma-rat-supply-chain-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - supply-chain
  - npm
  - asyncapi
  - miasma-rat
  - pull-request-target
  - ipfs
  mitre_attack:
  - T1195.002
  - T1552
  - T1059.007
  - T1105
  - T1543.002
  - T1053.003
  - T1018
  - T1102
  severity: HIGH
  package_id: pkg-028
spec:
  description: Responds to the AsyncAPI / Miasma RAT supply-chain compromise by quarantining affected runners and endpoints,
    removing trojanized package versions, revoking exposed credentials, removing unauthorized commits/releases and rebuilding
    from verified commits.
  trigger:
    source: BRAIN
    conditions:
    - field: alert.title
      operator: contains
      value: AsyncAPI Miasma RAT
    - field: alert.severity
      operator: gte
      value: HIGH
    cooldown: 2m
  inputs:
  - name: alert_id
    type: string
    required: true
    description: Unique identifier for the triggering alert
  - name: affected_asset
    type: string
    required: true
    description: FQDN, IP, or identifier of the affected asset
  - name: source_ip
    type: string
    required: false
    description: Source IP address associated with the activity
  steps:
  - id: step-1
    name: Quarantine affected runners and endpoints
    action: isolate_host
    target: endpoint
    parameters:
      scope: hosts_with_affected_versions
    timeout: 300
    on_failure: escalate_to_ir_team
  - id: step-2
    name: Remove affected versions and rebuild
    action: remediate_dependencies
    target: repository
    parameters:
      remove:
      - '@asyncapi/generator@3.3.1'
      - '@asyncapi/specs@6.11.2'
      - '@asyncapi/generator-helpers'
      - '@asyncapi/generator-components'
      rebuild_lockfiles: true
    timeout: 1800
    on_failure: escalate_to_devsecops
  - id: step-3
    name: Revoke exposed credentials and tokens
    action: rotate_credentials
    target: identity
    parameters:
      include:
      - github_pat
      - npm_token
      - ssh_keys
      - aws_credentials
    timeout: 900
    on_failure: escalate_to_identity_team
  - id: step-4
    name: Remove unauthorized commits, releases and workflows
    action: revert_repository_changes
    target: repository
    parameters:
      scope:
      - commits
      - releases
      - workflows
    timeout: 1800
    on_failure: escalate_to_github_admin
  - id: step-5
    name: Block Miasma RAT C2 indicators
    action: block_iocs
    target: network
    parameters:
      ips:
      - 85.137.53.71
      ports:
      - 8080
      - 8081
      - 8091
    timeout: 120
    on_failure: continue
  - id: step-6
    name: Preserve forensic evidence
    action: collect_logs
    target: endpoint
    parameters:
      sources:
      - process
      - network
      - github_audit
      - ci_runner
    timeout: 300
    on_failure: continue
  - id: step-7
    name: Reimage compromised endpoints
    action: reimage_host
    target: endpoint
    parameters:
      from_clean_image: true
    timeout: 3600
    on_failure: escalate_to_ir_team
  - id: step-8
    name: Reissue packages from verified commits
    action: rebuild_from_verified_source
    target: repository
    parameters:
      require_signed_commits: true
    timeout: 1800
    on_failure: escalate_to_devsecops
  outputs:
  - name: containment_status
    type: string
    description: Status of containment actions
  - name: exploitation_confidence
    type: string
    description: Confidence level of successful exploitation
  - name: affected_assets
    type: array
    description: List of impacted assets or accounts
  rollback:
    steps:
    - id: rb-1
      name: restore-service-availability
      action: script
    - id: rb-2
      name: remove-temporary-isolation
      action: api_call
