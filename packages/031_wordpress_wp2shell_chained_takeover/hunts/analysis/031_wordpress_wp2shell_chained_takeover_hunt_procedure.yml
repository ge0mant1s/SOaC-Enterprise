apiVersion: soac.io/v1
kind: ThreatHunt
metadata:
  name: 031-wordpress-wp2shell-chained-takeover-hunt
  version: 1.0.0
  author: SOaC Hunt Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-031
  mitre_attack:
  - T1190
  severity: HIGH
  data_sources:
  - Web server access logs
  - WAF logs
  - WordPress application logs
  - Cloud audit logs
  - Network flow logs
  tags:
  - wordpress
  - wp2shell
  - cve-2026-60137
  - cve-2026-63030
  - web-exploitation
  - chained-exploit
spec:
  hypothesis: An externally facing WordPress site was taken over by chaining CVE-2026-60137 and CVE-2026-63030 (WP2Shell).
  hunt_type: proactive
  analysis_steps:
  - id: step-031-001
    name: Confirm vulnerability exposure
    description: Determine whether the site is vulnerable to CVE-2026-60137 and CVE-2026-63030.
    tools:
    - Vulnerability scanner
    - Version inventory
  - id: step-031-002
    name: Analyze exploitation attempts
    description: Review web/WAF logs for exploit signatures and anomalous request bursts.
    tools:
    - Web logs
    - WAF
  - id: step-031-003
    name: Validate takeover (behavioral)
    description: Investigate admin-session anomalies, content changes and outbound connections to validate suspected takeover.
    tools:
    - Application logs
    - Network logs
  success_criteria:
  - Chained vulnerabilities are patched
  - Exploitation attempts are detected
  - Suspected takeover is validated or ruled out
  - Site restored from known-good backup if compromised
