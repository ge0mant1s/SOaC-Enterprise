apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 030-openclaw-clawhub-cve-2026-25253-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - openclaw
  - clawhub
  - ai-agent
  - supply-chain
  - typosquatting
  - amos
  mitre_attack:
  - T1195.002
  - T1204.001
  - T1204.002
  - T1059.004
  - T1105
  - T1190
  - T1555
  severity: HIGH
  package_id: pkg-030
spec:
  description: Responds to OpenClaw/ClawHub compromise by removing untrusted skills, upgrading to v2026.1.29, isolating affected
    hosts, revoking exposed credentials and rebuilding agents with the Control UI bound to localhost.
  trigger:
    source: BRAIN
    conditions:
    - field: alert.title
      operator: contains
      value: OpenClaw ClawHub
    - field: alert.severity
      operator: gte
      value: HIGH
    cooldown: 2m
  inputs:
  - name: alert_id
    type: string
    required: true
    description: Unique identifier for the triggering alert
  - name: affected_asset
    type: string
    required: true
    description: FQDN, IP, or identifier of the affected asset
  - name: source_ip
    type: string
    required: false
    description: Source IP address associated with the activity
  steps:
  - id: step-1
    name: Remove exposed Control UI from network
    action: restrict_service
    target: endpoint
    parameters:
      bind_to: 127.0.0.1
    timeout: 120
    on_failure: escalate_to_platform_team
  - id: step-2
    name: Upgrade OpenClaw to v2026.1.29
    action: patch_software
    target: endpoint
    parameters:
      product: openclaw
      version: 2026.1.29
    timeout: 1800
    on_failure: escalate_to_platform_team
  - id: step-3
    name: Remove untrusted skills
    action: remove_skills
    target: endpoint
    parameters:
      scope: untrusted_or_typosquatted
    timeout: 600
    on_failure: continue
  - id: step-4
    name: Isolate affected hosts
    action: isolate_host
    target: endpoint
    parameters:
      scope: hosts_with_malicious_skills
    timeout: 300
    on_failure: escalate_to_ir_team
  - id: step-5
    name: Revoke exposed credentials
    action: rotate_credentials
    target: identity
    parameters:
      include:
      - browser
      - api
      - cloud
      - crypto_wallet
      - keychain
    timeout: 900
    on_failure: escalate_to_identity_team
  - id: step-6
    name: Preserve forensic evidence
    action: collect_logs
    target: endpoint
    parameters:
      sources:
      - skill_md
      - shell_history
      - archives
      - process
      - network
    timeout: 300
    on_failure: continue
  - id: step-7
    name: Rebuild affected agents
    action: rebuild_agent
    target: endpoint
    parameters:
      from_clean_image: true
    timeout: 3600
    on_failure: escalate_to_ir_team
  outputs:
  - name: containment_status
    type: string
    description: Status of containment actions
  - name: exploitation_confidence
    type: string
    description: Confidence level of successful exploitation
  - name: affected_assets
    type: array
    description: List of impacted assets or accounts
  rollback:
    steps:
    - id: rb-1
      name: restore-service-availability
      action: script
    - id: rb-2
      name: remove-temporary-isolation
      action: api_call
