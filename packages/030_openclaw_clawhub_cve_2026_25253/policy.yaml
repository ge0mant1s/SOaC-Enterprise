apiVersion: soac.io/v1
kind: Policy
metadata:
  name: 030-openclaw-clawhub-cve-2026-25253-mitigation
  version: 1.0.0
  author: SOaC Policy Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-030
  scope: package
  tags:
  - openclaw
  - clawhub
  - ai-agent
  - supply-chain
  - typosquatting
  - amos
spec:
  description: Enforces trusted-skill governance and secure Control-UI configuration for OpenClaw deployments to reduce exposure
    to marketplace supply-chain abuse and Control-UI exploitation.
  environments:
  - name: lab
    mode: testing
    data_handling: relaxed
  - name: staging
    mode: staging
    data_handling: standard
  - name: production
    mode: production
    data_handling: strict
  access_control:
    required_roles:
    - Endpoint Security Engineer
    - AI Platform Engineer
    - DevSecOps Engineer
    approval_workflow: true
  compliance_frameworks:
  - NIST CSF 2.0
  - ISO/IEC 27001:2022
  - MITRE ATT&CK
  - CIS Controls v8
  controls:
  - name: Trusted-skill allowlisting
    description: Only vetted, allowlisted ClawHub skills may be installed; typosquatted/untrusted skills are blocked.
    enforcement: automated
    evidence: Skill allowlist and installation audit
  - name: Bind Control UI to localhost
    description: The OpenClaw Control UI must bind to 127.0.0.1 and never be exposed to untrusted networks.
    enforcement: automated
    evidence: Agent configuration audit
  - name: Maintain patched agent versions
    description: OpenClaw agents must run v2026.1.29 or later to remediate CVE-2026-25253.
    enforcement: automated
    evidence: Version inventory / patch compliance
  - name: Skill prerequisite execution review
    description: SKILL.md prerequisites are reviewed and sandboxed before execution.
    enforcement: manual
    evidence: Skill review records
