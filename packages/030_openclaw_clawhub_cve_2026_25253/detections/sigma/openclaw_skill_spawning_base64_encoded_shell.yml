title: OpenClaw skill spawning Base64-encoded shell
id: rule-030-001
status: experimental
description: Detects the OpenClaw agent spawning a shell with Base64-encoded commands shortly after skill installation (behavioral;
  encoded shell is also used legitimately).
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|contains: openclaw
    Image|endswith:
    - /bash
    - /sh
    - /zsh
    CommandLine|contains:
    - base64 -d
    - base64 --decode
    - '| base64'
  condition: selection
mitre:
- T1059.004
- T1204.002
level: high
