apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 025-citrix-netscaler-rce-webshells-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - citrix
  - netscaler
  - adc
  - gateway
  - cve-2026-88771
  - web-shell
  mitre_attack:
  - T1190
  - T1059
  - T1505.003
  - T1105
  - T1572
  - T1083
  - T1041
  severity: CRITICAL
  package_id: pkg-025
spec:
  description: 'CLAW response playbook for suspected NetScaler exploitation: remove external exposure, upgrade to fixed releases,
    hunt for web shells/tunnels, revoke sessions and rebuild where persistence is confirmed.'
  trigger:
    source: BRAIN
    conditions:
    - field: alert.title
      operator: contains
      value: Citrix NetScaler
    - field: alert.severity
      operator: gte
      value: HIGH
    cooldown: 2m
  inputs:
  - name: alert_id
    type: string
    required: true
    description: Unique identifier for the triggering alert
  - name: affected_asset
    type: string
    required: true
    description: FQDN, IP, or identifier of the affected asset
  - name: source_ip
    type: string
    required: false
    description: Source IP address associated with the activity
  steps:
  - id: step-1
    name: remove-external-exposure
    action: api_call
    target: network_acl
    parameters:
      asset: unpatched_netscaler
      action: remove_external_exposure
    timeout: 120s
    on_failure: escalate
  - id: step-2
    name: upgrade-fixed-release
    action: api_call
    target: patch_manager
    parameters:
      targets:
      - 14.1-73.37+
      - 13.1-64.23+
      include_fips_ndcpp: true
    timeout: 600s
    on_failure: escalate
  - id: step-3
    name: preserve-appliance-evidence
    action: script
    target: evidence_collector
    parameters:
      artifacts:
      - traffic
      - audit_logs
      - crash_data
      - process_state
      - filesystem_metadata
    timeout: 300s
    on_failure: continue
  - id: step-4
    name: hunt-webshells-tunnels
    action: script
    target: hunt_engine
    parameters:
      targets:
      - php_webshells
      - python_processes
      - new_files
      - outbound_tunnels
      - internal_recon
    timeout: 300s
    on_failure: continue
  - id: step-5
    name: revoke-sessions-rotate-secrets
    action: api_call
    target: identity_provider
    parameters:
      revoke_sessions: true
      rotate:
      - admin_credentials
      - appliance_secrets
    timeout: 180s
    on_failure: escalate
  - id: step-6
    name: rebuild-compromised-appliance
    action: script
    target: appliance
    parameters:
      condition: command_execution_or_webshell_confirmed
    timeout: 600s
    on_failure: escalate
  - id: step-7
    name: validate-ha-peers-backups
    action: script
    target: appliance
    parameters:
      check:
      - ha_peers
      - backups
      for: malicious_changes
    timeout: 240s
    on_failure: continue
  outputs:
  - name: containment_status
    type: string
    description: Status of containment actions
  - name: exploitation_confidence
    type: string
    description: Confidence level of successful exploitation
  - name: affected_assets
    type: array
    description: List of impacted assets or accounts
  rollback:
    steps:
    - id: rb-1
      name: restore-service-availability
      action: script
    - id: rb-2
      name: remove-temporary-isolation
      action: api_call
