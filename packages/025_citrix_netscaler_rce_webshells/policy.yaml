apiVersion: soac.io/v1
kind: Policy
metadata:
  name: 025-citrix-netscaler-rce-webshells-mitigation
  version: 1.0.0
  author: SOaC Policy Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-025
  scope: package
  tags:
  - citrix
  - netscaler
  - adc
  - gateway
  - cve-2026-88771
  - web-shell
spec:
  description: Governance policy to maintain supported NetScaler releases, restrict management access, centralize logs, minimize
    appliance egress and monitor web-serving directories for unauthorized changes.
  environments:
  - name: lab
    mode: testing
    data_handling: relaxed
  - name: staging
    mode: staging
    data_handling: standard
  - name: production
    mode: production
    data_handling: strict
  access_control:
    required_roles:
    - Network Security Engineer
    - Incident Responder
    - Vulnerability Manager
    approval_workflow: true
  compliance_frameworks:
  - NIST CSF 2.0
  - ISO/IEC 27001:2022
  - MITRE ATT&CK
  - CIS Controls v8
  controls:
  - name: Supported-release maintenance
    description: Maintain fixed Citrix releases (14.1-73.37+ / 13.1-64.23+ and corresponding FIPS/NDcPP releases).
    enforcement: mandatory
    evidence: Version inventory and patch records
  - name: Management access restriction
    description: Restrict appliance management access to trusted networks.
    enforcement: mandatory
    evidence: Access control configuration
  - name: Appliance egress minimization
    description: Minimize appliance egress and alert on outbound sessions inconsistent with ADC/Gateway role.
    enforcement: mandatory
    evidence: Egress policy and network monitoring
  - name: Web-root integrity monitoring
    description: Monitor web-serving directories for unauthorized file changes.
    enforcement: mandatory
    evidence: File-integrity monitoring configuration
