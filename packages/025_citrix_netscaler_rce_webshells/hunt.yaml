apiVersion: soac.io/v1
kind: ThreatHunt
metadata:
  name: 025-citrix-netscaler-rce-webshells-hunt
  version: 1.0.0
  author: SOaC Hunt Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-025
  mitre_attack:
  - T1190
  - T1059
  - T1505.003
  - T1105
  - T1572
  - T1083
  - T1041
  severity: CRITICAL
  data_sources:
  - NetScaler web/audit/system logs
  - Network flow
  - Appliance file-system metadata
  - Web-server logs
  tags:
  - citrix
  - netscaler
  - adc
  - gateway
  - cve-2026-88771
  - web-shell
spec:
  description: Proactive hunt for NetScaler exploitation, web-shell deployment and appliance-originated tunneling/exfiltration.
  hypothesis: An adversary exploited an unmitigated NetScaler appliance, deployed a PHP web shell and is tunneling or exfiltrating
    through the appliance.
  hunt_type: proactive
  telemetry_sources:
  - NetScaler web/audit/system logs
  - Network flow
  - Appliance file-system metadata
  - Web-server logs
  queries:
  - id: query-025-001
    name: Request burst followed by appliance process execution
    platform: kql
    mitre:
    - T1190
    - T1059
    query: |-
      // Behavioral: burst of unusual requests to NetScaler followed by process execution / PHP creation.
      let burst = CommonSecurityLog
      | where DeviceProduct has "NetScaler"
      | summarize Reqs=count() by SourceIP, bin(TimeGenerated, 5m)
      | where Reqs > 50;
      burst
      | join kind=leftouter (DeviceProcessEvents | where InitiatingProcessFileName in~ ("httpd","nsppe","php")) on $left.TimeGenerated == $right.TimeGenerated
      | project TimeGenerated, SourceIP, Reqs, FileName, ProcessCommandLine
    expected_results: A request burst coinciding with appliance process execution or PHP creation indicates likely exploitation.
  - id: query-025-002
    name: Appliance log discontinuity after suspicious requests
    platform: sigma
    mitre:
    - T1070
    sigma_detection:
      selection:
        message|contains:
        - log rotation
        - audit stopped
        - nslog restart
      condition: selection
    logsource:
      product: linux
      service: syslog
    query: message contains audit stopped
    expected_results: A log discontinuity following suspicious requests on the same appliance warrants investigation.
  analysis_steps:
  - id: as-025-001
    name: Validate appliance web paths
    description: Confirm appliance web-serving directories and process trees from Citrix forensic guidance before enabling
      production file rules.
    tools:
    - Citrix forensic guidance
    - File-integrity monitoring
  - id: as-025-002
    name: Correlate requests with process/file events
    description: Join web/audit events with new file creation and process execution on the appliance.
    tools:
    - Sentinel
    - Splunk
  - id: as-025-003
    name: Scope internal access
    description: Investigate internal hosts accessed through the appliance and validate HA peers/backups.
    tools:
    - Network flow
    - EDR
  success_criteria:
  - Appliance web roots validated and monitored
  - Any web shells or tunnels identified and scoped
  - HA peers and backups validated clean
  - Internal hosts accessed through the appliance investigated
  escalation:
    on_confirmed: Declare an incident, remove exposure, upgrade/rebuild appliances, revoke sessions and rotate appliance-held
      secrets.
    on_inconclusive: Validate appliance paths against Citrix guidance, enable web-root integrity monitoring and schedule a
      follow-up hunt.
