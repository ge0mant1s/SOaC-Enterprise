apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 026-dell-recoverpoint-hardcoded-credential-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - dell
  - recoverpoint
  - vmware
  - cve-2026-22769
  - hardcoded-credential
  - unc6201
  mitre_attack:
  - T1078
  - T1133
  - T1059
  - T1543
  - T1021
  severity: CRITICAL
  package_id: pkg-026
spec:
  steps:
  - id: step-5
    name: rotate-appliance-credentials
    action: api_call
    target: identity_provider
    parameters:
      rotate:
      - appliance_credentials
      - credentials_accessible_from_appliance
    timeout: 180s
    on_failure: escalate
  - id: step-6
    name: rebuild-on-root-compromise
    action: script
    target: recoverpoint
    parameters:
      condition: confirmed_root_access
      action: treat_as_integrity_failure_and_rebuild
    timeout: 600s
    on_failure: escalate
  - id: step-7
    name: investigate-vmware-pivot
    action: script
    target: hunt_engine
    parameters:
      scope: vmware_systems_contacted_after_initial_access
    timeout: 300s
    on_failure: continue
  - id: step-8
    name: reapply-remediation-after-reimage
    action: script
    target: recoverpoint
    parameters:
      when: after_reimage_or_older_affected_deploy
      per: dell_guidance
    timeout: 240s
    on_failure: continue
