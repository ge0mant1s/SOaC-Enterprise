apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 026-dell-recoverpoint-hardcoded-credential-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - dell
  - recoverpoint
  - vmware
  - cve-2026-22769
  - hardcoded-credential
  - unc6201
  mitre_attack:
  - T1078
  - T1133
  - T1059
  - T1543
  - T1021
  severity: CRITICAL
  package_id: pkg-026
spec:
  steps:
  - id: step-1
    name: block-untrusted-access
    action: api_call
    target: network_acl
    parameters:
      asset: recoverpoint
      allow: trusted_management_only
    timeout: 120s
    on_failure: escalate
  - id: step-2
    name: apply-fixed-release
    action: api_call
    target: patch_manager
    parameters:
      target: 6.0.3.1 HF1 or supported upgrade path
    timeout: 600s
    on_failure: escalate
  - id: step-3
    name: apply-remediation-script
    action: script
    target: recoverpoint
    parameters:
      script: dell_dsa_remediation
      when: immediate_upgrade_not_possible
    timeout: 240s
    on_failure: continue
  - id: step-4
    name: preserve-evidence
    action: script
    target: evidence_collector
    parameters:
      artifacts:
      - authentication
      - shell
      - process
      - network
      - virtualization_logs
    timeout: 300s
    on_failure: continue
