apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 026-dell-recoverpoint-hardcoded-credential-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - dell
  - recoverpoint
  - vmware
  - cve-2026-22769
  - hardcoded-credential
  - unc6201
  mitre_attack:
  - T1078
  - T1133
  - T1059
  - T1543
  - T1021
  severity: CRITICAL
  package_id: pkg-026
spec:
  description: 'CLAW response playbook for suspected Dell RecoverPoint hardcoded-credential exploitation: block untrusted
    access, apply the fixed release or remediation script, preserve evidence, rotate credentials and investigate VMware pivot.'
  trigger:
    source: BRAIN
    conditions:
    - field: alert.title
      operator: contains
      value: Dell RecoverPoint
    - field: alert.severity
      operator: gte
      value: HIGH
    cooldown: 2m
  inputs:
  - name: alert_id
    type: string
    required: true
    description: Unique identifier for the triggering alert
  - name: affected_asset
    type: string
    required: true
    description: FQDN, IP, or identifier of the affected asset
  - name: source_ip
    type: string
    required: false
    description: Source IP address associated with the activity
  steps:
  - id: step-1
    name: block-untrusted-access
    action: api_call
    target: network_acl
    parameters:
      asset: recoverpoint
      allow: trusted_management_only
    timeout: 120s
    on_failure: escalate
  - id: step-2
    name: apply-fixed-release
    action: api_call
    target: patch_manager
    parameters:
      target: 6.0.3.1 HF1 or supported upgrade path
    timeout: 600s
    on_failure: escalate
  - id: step-3
    name: apply-remediation-script
    action: script
    target: recoverpoint
    parameters:
      script: dell_dsa_remediation
      when: immediate_upgrade_not_possible
    timeout: 240s
    on_failure: continue
  - id: step-4
    name: preserve-evidence
    action: script
    target: evidence_collector
    parameters:
      artifacts:
      - authentication
      - shell
      - process
      - network
      - virtualization_logs
    timeout: 300s
    on_failure: continue
  - id: step-5
    name: rotate-appliance-credentials
    action: api_call
    target: identity_provider
    parameters:
      rotate:
      - appliance_credentials
      - credentials_accessible_from_appliance
    timeout: 180s
    on_failure: escalate
  - id: step-6
    name: rebuild-on-root-compromise
    action: script
    target: recoverpoint
    parameters:
      condition: confirmed_root_access
      action: treat_as_integrity_failure_and_rebuild
    timeout: 600s
    on_failure: escalate
  - id: step-7
    name: investigate-vmware-pivot
    action: script
    target: hunt_engine
    parameters:
      scope: vmware_systems_contacted_after_initial_access
    timeout: 300s
    on_failure: continue
  - id: step-8
    name: reapply-remediation-after-reimage
    action: script
    target: recoverpoint
    parameters:
      when: after_reimage_or_older_affected_deploy
      per: dell_guidance
    timeout: 240s
    on_failure: continue
  outputs:
  - name: containment_status
    type: string
    description: Status of containment actions
  - name: exploitation_confidence
    type: string
    description: Confidence level of successful exploitation
  - name: affected_assets
    type: array
    description: List of impacted assets or accounts
  rollback:
    steps:
    - id: rb-1
      name: restore-service-availability
      action: script
    - id: rb-2
      name: remove-temporary-isolation
      action: api_call
