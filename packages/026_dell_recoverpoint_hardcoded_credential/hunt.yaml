apiVersion: soac.io/v1
kind: ThreatHunt
metadata:
  name: 026-dell-recoverpoint-hardcoded-credential-hunt
  version: 1.0.0
  author: SOaC Hunt Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-026
  mitre_attack:
  - T1078
  - T1133
  - T1059
  - T1543
  - T1021
  severity: CRITICAL
  data_sources:
  - RecoverPoint appliance logs
  - SSH authentication logs
  - VMware vCenter/ESXi logs
  - Network flow
  - Identity logs
  tags:
  - dell
  - recoverpoint
  - vmware
  - cve-2026-22769
  - hardcoded-credential
  - unc6201
spec:
  description: Proactive hunt for RecoverPoint hardcoded-credential exploitation, root persistence and VMware pivot.
  hypothesis: An adversary used the hardcoded credential to access a RecoverPoint appliance, established root persistence
    and is pivoting toward VMware management infrastructure.
  hunt_type: proactive
  telemetry_sources:
  - RecoverPoint appliance logs
  - SSH authentication logs
  - VMware vCenter/ESXi logs
  - Network flow
  - Identity logs
  queries:
  - id: query-026-001
    name: Repeated appliance access across multiple nodes
    platform: kql
    mitre:
    - T1078
    query: |-
      // Behavioral: a single source authenticating to RecoverPoint management across multiple nodes.
      Syslog
      | where Computer has "recoverpoint"
      | where SyslogMessage has_any ("Accepted", "login")
      | extend src = extract(@"from ([0-9]{1,3}(?:\.[0-9]{1,3}){3})", 1, SyslogMessage)
      | summarize Nodes=dcount(Computer), NodeSet=make_set(Computer, 20) by src
      | where Nodes > 1
    expected_results: A source authenticating across multiple appliance nodes warrants investigation.
  - id: query-026-002
    name: Root persistence service change on appliance
    platform: sigma
    mitre:
    - T1543
    sigma_detection:
      selection:
        message|contains:
        - 'systemd: Created slice'
        - new service installed
        - crontab entry added
      condition: selection
    logsource:
      product: linux
      service: syslog
    query: message contains new service installed
    expected_results: Unexpected service/persistence changes after a remote session require validation against clean appliances.
  analysis_steps:
  - id: as-026-001
    name: Build identity baseline
    description: Establish approved RecoverPoint identities, management sources and maintenance windows.
    tools:
    - Identity inventory
    - Change management
  - id: as-026-002
    name: Correlate root access with VMware pivot
    description: Join appliance root activity with subsequent connections to VMware management infrastructure.
    tools:
    - Sentinel
    - Splunk
  - id: as-026-003
    name: Validate persistence against clean baseline
    description: Compare appliance processes, services and paths to a known-good appliance before asserting T1543.
    tools:
    - Forensic collector
    - Baseline image
  success_criteria:
  - All appliance access reconciled against approved identity/source baseline
  - Root sessions mapped to maintenance records
  - VMware systems contacted post-access investigated
  - Persistence validated against a clean baseline before asserting service-creation technique
  escalation:
    on_confirmed: Declare an incident, block untrusted access, rebuild the appliance, rotate all accessible credentials and
      investigate VMware infrastructure.
    on_inconclusive: Apply the remediation script, tighten network placement and schedule a follow-up hunt after patch verification.
