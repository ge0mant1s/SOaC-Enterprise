apiVersion: soac.io/v1
kind: ThreatHunt
metadata:
  name: 026-dell-recoverpoint-hardcoded-credential-hunt
  version: 1.0.0
  author: SOaC Hunt Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-026
  mitre_attack:
  - T1078
  - T1133
  - T1059
  - T1543
  - T1021
  severity: CRITICAL
  data_sources:
  - RecoverPoint appliance logs
  - SSH authentication logs
  - VMware vCenter/ESXi logs
  - Network flow
  - Identity logs
  tags:
  - dell
  - recoverpoint
  - vmware
  - cve-2026-22769
  - hardcoded-credential
  - unc6201
spec:
  hypothesis: An adversary used the hardcoded credential to access a RecoverPoint appliance, established root persistence
    and is pivoting toward VMware management infrastructure.
  hunt_type: proactive
  analysis_steps:
  - id: as-026-001
    name: Build identity baseline
    description: Establish approved RecoverPoint identities, management sources and maintenance windows.
    tools:
    - Identity inventory
    - Change management
  - id: as-026-002
    name: Correlate root access with VMware pivot
    description: Join appliance root activity with subsequent connections to VMware management infrastructure.
    tools:
    - Sentinel
    - Splunk
  - id: as-026-003
    name: Validate persistence against clean baseline
    description: Compare appliance processes, services and paths to a known-good appliance before asserting T1543.
    tools:
    - Forensic collector
    - Baseline image
  success_criteria:
  - All appliance access reconciled against approved identity/source baseline
  - Root sessions mapped to maintenance records
  - VMware systems contacted post-access investigated
  - Persistence validated against a clean baseline before asserting service-creation technique
