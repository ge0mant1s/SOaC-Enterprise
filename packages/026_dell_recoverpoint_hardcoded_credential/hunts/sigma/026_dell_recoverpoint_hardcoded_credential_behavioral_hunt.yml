title: Root persistence service change on appliance
id: query-026-002
status: hunt
description: Unexpected service/persistence changes after a remote session require validation against clean appliances.
logsource:
  product: linux
  service: syslog
detection:
  selection:
    message|contains:
    - 'systemd: Created slice'
    - new service installed
    - crontab entry added
  condition: selection
level: high
