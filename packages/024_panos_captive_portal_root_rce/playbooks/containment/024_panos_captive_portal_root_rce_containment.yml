apiVersion: claw.soac.io/v1
kind: Playbook
metadata:
  name: 024-panos-captive-portal-root-rce-response
  version: 1.0.0
  author: SOaC CLAW Engineering Team
  created: '2026-10-09T12:00:00Z'
  tags:
  - palo-alto
  - pan-os
  - captive-portal
  - user-id
  - cve-2026-0300
  - cl-sta-1132
  mitre_attack:
  - T1190
  - T1059
  - T1105
  - T1572
  - T1087
  - T1018
  - T1070
  severity: CRITICAL
  package_id: pkg-024
spec:
  steps:
  - id: step-1
    name: restrict-portal-access
    action: api_call
    target: firewall_config
    parameters:
      portal: user-id-auth
      allow: trusted_internal_only
      disable_if_unused: true
    timeout: 120s
    on_failure: escalate
  - id: step-2
    name: block-untrusted-response-pages
    action: api_call
    target: firewall_config
    parameters:
      response_pages: block_untrusted_interfaces
    timeout: 90s
    on_failure: continue
  - id: step-3
    name: isolate-firewall
    action: api_call
    target: network_control
    parameters:
      asset: affected_firewall
      mode: isolate_on_root_exec_or_tunnel
    timeout: 180s
    on_failure: escalate
  - id: step-4
    name: preserve-evidence
    action: script
    target: evidence_collector
    parameters:
      artifacts:
      - config
      - core_files
      - system_logs
      - network_flows
      - admin_history
    timeout: 300s
    on_failure: continue
