apiVersion: soac.io/v1
kind: ThreatHunt
metadata:
  name: 024-panos-captive-portal-root-rce-hunt
  version: 1.0.0
  author: SOaC Hunt Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-024
  mitre_attack:
  - T1190
  - T1059
  - T1105
  - T1572
  - T1087
  - T1018
  - T1070
  severity: CRITICAL
  data_sources:
  - PAN-OS threat/system logs
  - Firewall traffic logs
  - Network flow
  - Active Directory logs
  tags:
  - palo-alto
  - pan-os
  - captive-portal
  - user-id
  - cve-2026-0300
  - cl-sta-1132
spec:
  description: Proactive hunt for PAN-OS Captive Portal exploitation and post-exploitation tunneling/enumeration behaviors.
  hypothesis: An adversary exploited the User-ID Authentication Portal and is tunneling out of the firewall and enumerating
    Active Directory from the appliance.
  hunt_type: proactive
  telemetry_sources:
  - PAN-OS threat/system logs
  - Firewall traffic logs
  - Network flow
  - Active Directory logs
  queries:
  - id: query-024-001
    name: Firewall to directory-service traffic
    platform: kql
    mitre:
    - T1087
    - T1018
    query: |-
      // Behavioral: firewall initiating LDAP/GC traffic to domain controllers inconsistent with its role.
      CommonSecurityLog
      | where DeviceVendor == "Palo Alto Networks"
      | where DestinationPort in (389, 636, 3268, 3269)
      | summarize Count=count(), Dests=make_set(DestinationIP, 20) by DeviceName, bin(TimeGenerated, 1h)
      | where Count > 10
    expected_results: A firewall generating sustained directory-service queries may indicate post-exploitation enumeration.
  - id: query-024-002
    name: Portal crash followed by log-service gap
    platform: sigma
    mitre:
    - T1070
    sigma_detection:
      selection:
        log_type:
        - system
        eventid|contains:
        - crash
        - general
        - log-collector
      condition: selection
    logsource:
      category: firewall
      product: panos
    query: log_type system AND (crash OR log-collector)
    expected_results: A portal crash immediately followed by a log-service interruption on the same firewall warrants investigation.
  analysis_steps:
  - id: as-024-001
    name: Baseline firewall egress
    description: Establish normal outbound destinations and ports for each firewall appliance.
    tools:
    - Network flow
    - Sentinel
  - id: as-024-002
    name: Correlate portal events with tunnels
    description: Join portal exploit/crash events with new long-lived outbound sessions and reverse SOCKS behavior.
    tools:
    - Sentinel
    - Splunk
  - id: as-024-003
    name: Scope internal impact
    description: Investigate Active Directory and internal systems contacted after the suspected exploitation time.
    tools:
    - AD logs
    - EDR
  success_criteria:
  - Firewall egress reconciled against an approved baseline
  - Any appliance-originated tunnels identified and scoped
  - Internal systems contacted post-exploitation investigated
  escalation:
    on_confirmed: Declare an incident, isolate the firewall, upgrade PAN-OS, rotate exposed credentials and investigate internal
      lateral movement.
    on_inconclusive: Tighten portal exposure, enable ATP Threat ID 510019 and schedule a follow-up egress hunt.
