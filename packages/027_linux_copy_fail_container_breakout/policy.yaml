apiVersion: soac.io/v1
kind: Policy
metadata:
  name: 027-linux-copy-fail-container-breakout-mitigation
  version: 1.0.0
  author: SOaC Policy Engineering Team
  created: '2026-10-09T12:00:00Z'
  package_id: pkg-027
  scope: package
  tags:
  - linux
  - kernel
  - copy-fail
  - cve-2026-31431
  - af_alg
  - container-breakout
spec:
  description: Enforces least-privilege container execution, host isolation and automated kernel/node-image refresh to reduce
    exposure to Copy Fail-class local privilege escalation and container-escape vulnerabilities.
  environments:
  - name: lab
    mode: testing
    data_handling: relaxed
  - name: staging
    mode: staging
    data_handling: standard
  - name: production
    mode: production
    data_handling: strict
  access_control:
    required_roles:
    - Cloud Security Engineer
    - Linux Engineer
    - DevSecOps Engineer
    approval_workflow: true
  compliance_frameworks:
  - NIST CSF 2.0
  - ISO/IEC 27001:2022
  - MITRE ATT&CK
  - CIS Controls v8
  controls:
  - name: Run containers as non-root
    description: Containers must run with a non-root user and drop unnecessary Linux capabilities.
    enforcement: automated
    evidence: Pod security admission / runtime policy reports
  - name: Minimize host mounts and privileges
    description: Disallow privileged containers and minimize host path mounts and shared namespaces.
    enforcement: automated
    evidence: Admission-controller policy decisions
  - name: Constrain untrusted CI jobs
    description: Untrusted CI/CD jobs run in isolated, ephemeral, least-privilege sandboxes.
    enforcement: automated
    evidence: CI runner configuration and audit logs
  - name: Automated kernel and node-image refresh
    description: Kernels and managed node images are automatically patched and refreshed on a defined cadence.
    enforcement: automated
    evidence: Patch-management and node-pool upgrade records
