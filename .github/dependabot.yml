# Dependabot configuration for SOaC-Enterprise
# Keeps dependencies and GitHub Actions patched (OSPS Baseline / Security Slam).
version: 2
updates:
  # Python dependencies (repo root requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # Node dependencies for the validation harness
  - package-ecosystem: "npm"
    directory: "/tools/soac-harness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # TypeScript 7.x is the native/Go compiler rewrite and is not yet
      # compatible with the ts-node setup used by the validation harness
      # (bump breaks `npm run validate`). Keep 4.x/5.x/6.x minor + patch
      # security updates flowing; revisit the major when ts-node supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # All github/codeql-action sub-actions (init, analyze, upload-sarif, ...)
      # MUST move together: CodeQL refuses to run if steps are on mixed major
      # versions ("Loaded a configuration file for version X, running Y").
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "github-actions"
