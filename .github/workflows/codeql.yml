# ============================================================================
# CodeQL Analysis
# ============================================================================
# Static analysis for the repository's languages (JavaScript/TypeScript and
# Python). Runs on pushes and pull requests to main, plus a weekly schedule.
# Results appear in the GitHub code-scanning dashboard.
#
# Supports OSPS Baseline static-analysis / SAST expectations and provides
# evidence toward the Security Slam "Mechanizer" and "Defender" objectives.
#
# NOTE: results upload requires GitHub code scanning on the repo. For public
# repos this is available by default.
# ============================================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'   # Weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL results to the code-scanning dashboard.
      security-events: write
      # Required for workflows in private repos / to read the Actions metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow files themselves (injection, unpinned
        # or over-privileged steps).
        language: ['actions', 'javascript-typescript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: '/language:${{ matrix.language }}'
