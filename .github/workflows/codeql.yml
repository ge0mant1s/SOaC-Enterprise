# ============================================================================
# CodeQL Analysis
# ============================================================================
# Static analysis for the repository's languages (JavaScript/TypeScript and
# Python). Runs on pushes and pull requests to main, plus a weekly schedule.
# Results appear in the GitHub code-scanning dashboard.
#
# Supports OSPS Baseline static-analysis / SAST expectations and provides
# evidence toward the Security Slam "Mechanizer" and "Defender" objectives.
#
# NOTE: results upload requires GitHub code scanning on the repo. For public
# repos this is available by default.
# ============================================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'   # Weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL results to the code-scanning dashboard.
      security-events: write
      # Required for workflows in private repos / to read the Actions metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: '/language:${{ matrix.language }}'
