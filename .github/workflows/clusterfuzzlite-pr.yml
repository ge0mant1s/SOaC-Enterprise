# ============================================================================
# PR fuzzing (Jazzer.js) — continuous dynamic analysis
# ============================================================================
# Runs the Jazzer.js fuzz targets in tools/soac-harness/fuzz/ on pull requests
# that touch the harness, for a short budget, starting from the corpus the daily
# batch run keeps in the Actions cache (restore only; PRs never write it).
#
# The ClusterFuzzLite actions are not used because they cannot fuzz JavaScript
# (sanitizer mismatch; see clusterfuzzlite-batch.yml). The .clusterfuzzlite/
# build config stays in the repo for Scorecard's Fuzzing check.
#
# Staged in patches/workflows/; applied by tools/sync-workflows.sh.
name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - 'tools/soac-harness/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite-pr.yml'
permissions:
  contents: read
jobs:
  fuzz:
    name: fuzz (jazzer.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cflite-pr-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: tools/soac-harness
    env:
      FUZZ_SECONDS_PER_TARGET: 300
      CORPUS_DIR: ${{ github.workspace }}/.fuzz-corpus
      ARTIFACT_DIR: ${{ github.workspace }}/.fuzz-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Restore corpus from the batch run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz-corpus
          key: jazzer-corpus-pr-${{ github.run_id }}
          restore-keys: jazzer-corpus-

      - name: Install locked dependencies and build
        run: |
          npm ci
          npx tsc -p .

      - name: Fuzz
        run: |
          set -uo pipefail
          mkdir -p "$ARTIFACT_DIR"
          status=0
          for target in fuzz/*.fuzz.js; do
            name="$(basename "$target" .fuzz.js)"
            mkdir -p "$CORPUS_DIR/$name"
            echo "::group::fuzz $name (${FUZZ_SECONDS_PER_TARGET}s)"
            npx jazzer "$target" --sync -- "$CORPUS_DIR/$name" \
              -max_total_time="$FUZZ_SECONDS_PER_TARGET" \
              -artifact_prefix="$ARTIFACT_DIR/$name-" || status=$?
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Fuzzing found a crash (exit $status). Reproducer uploaded as the fuzz-crashes artifact."
          fi
          exit "$status"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: .fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 30
