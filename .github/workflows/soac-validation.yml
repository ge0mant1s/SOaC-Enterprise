name: SOaC Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token: this workflow only checks out the repo and
# runs the harness validation; it needs read-only access to repo contents.
# (OSPS Baseline: restrict GITHUB_TOKEN permissions.)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
        working-directory: tools/soac-harness
      - name: Run SOaC validation
        run: npm run validate
        working-directory: tools/soac-harness
