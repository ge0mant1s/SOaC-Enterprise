# ============================================================================
# OpenSSF Scorecard
# ============================================================================
# Runs the official OpenSSF Scorecard analysis on a schedule and on pushes to
# the default branch, publishes the results to the public Scorecard API
# (publish_results: true) and uploads the SARIF to GitHub code scanning.
#
# Supports the Security Slam "Mechanizer" objective (a recurring automated
# security scan wired into the default branch) and provides evidence toward
# "Defender". A passing score is not required for Mechanizer.
#
# NOTE: code-scanning SARIF upload requires GitHub code scanning to be
# available on the repo. If it is not enabled, the "Upload to code-scanning"
# step may fail; the artifact upload still provides the raw results.
# ============================================================================
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'   # Weekly, Monday 06:27 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only; individual jobs elevate only what they need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and receive a badge (OIDC token).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the public OpenSSF Scorecard API. This is what
          # makes the score externally visible; set to false to keep private.
          publish_results: true

      - name: Upload artifact (raw SARIF)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
